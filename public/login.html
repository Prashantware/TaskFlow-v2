<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow – Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app" style="max-width:440px">
    <h1>Task<span>Flow</span></h1>
    <p class="subtitle">Plan it. Do it. Tick it off.</p>

    <div class="tabs">
      <button class="tab active" data-tab="login">Login</button>
      <button class="tab" data-tab="register">Register</button>
    </div>

    <form id="login-form">
      <label>Email</label><input type="email" id="l-email" required />
      <label>Password</label><input type="password" id="l-pass" required />
      <button class="btn btn-primary btn-block" type="submit">Login</button>
    </form>

    <form id="register-form" hidden>
      <label>I am a</label>
      <div class="role-pick">
        <label><input type="radio" name="role" value="student" /><span>🎓 Student</span></label>
        <label><input type="radio" name="role" value="user" checked /><span>👤 User</span></label>
      </div>
      <label>Full name</label><input id="r-name" required maxlength="60" />
      <label>Email</label><input type="email" id="r-email" required />
      <label>Password (min 6 characters)</label><input type="password" id="r-pass" minlength="6" required />
      <div id="student-fields" hidden>
        <label>College / School</label><input id="r-college" maxlength="80" />
        <label>Course</label><input id="r-course" maxlength="80" />
        <label>Year</label><input id="r-year" maxlength="20" placeholder="e.g. 2nd year" />
      </div>
      <button class="btn btn-primary btn-block" type="submit">Create account</button>
    </form>
    <p id="msg" class="error" hidden></p>
  </main>
  <script src="auth.js"></script>
  <script src="login.js"></script>
</body>
</html>
